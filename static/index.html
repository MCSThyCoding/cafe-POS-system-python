<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cafe POS</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Step 1: Login -->
  <main id="login-view" class="login-bg hidden">
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="logo-badge">☕</div>
      <h1>Cafe POS</h1>
      <p class="muted">Coffee Shop Management System</p>
      <label for="username">Username</label>
      <input id="username" name="username" placeholder="Enter your username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Enter your password" required>
      <p id="login-error" class="error hidden"></p>
      <button class="btn btn-primary btn-block" type="submit">Login →</button>
    </form>
  </main>

  <!-- App shell (menu depends on role) -->
  <div id="app-view" class="app hidden">
    <aside class="sidebar">
      <div class="brand">☕ Cafe POS</div>
      <nav id="nav"></nav>
      <div class="whoami">
        <small>Logged in as</small>
        <strong id="who-name"></strong>
        <span id="who-role" class="role"></span>
        <button id="logout" class="link-btn">⎋ Logout</button>
      </div>
    </aside>
    <section id="page" class="page"></section>
  </div>

  <div id="modal" class="modal hidden"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="/static/vendor/chart.umd.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
